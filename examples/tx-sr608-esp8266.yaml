# Example configuration for the ESPHome Onkyo ISCP component.
# Replace all !secret values with entries from your secrets.yaml file.
#
# WARNING: The master-volume sliders can cause large and very fast volume
# changes. Check the current value before moving a slider and increase the
# volume carefully. A configurable runtime maximum-volume limit is planned
# for a future release, but is not implemented in v0.7.0.

substitutions:
  device_name: onkyo-tx-sr608
  friendly_name: Onkyo TX-SR608

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp8266:
  board: nodemcuv2

# UART0 is used for communication with the receiver.
# Disable serial logger output to avoid conflicts on GPIO1 and GPIO3.
logger:
  baud_rate: 0
  level: DEBUG

api:
  encryption:
    key: !secret onkyo_api_key

ota:
  - platform: esphome
    password: !secret onkyo_ota_password

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot

  ap:
    ssid: "Onkyo Fallback"
    password: !secret fallback_password

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/domhit/esphome-onkyo-iscp
      ref: v0.7.0
    components:
      - onkyo_iscp
    refresh: 0s

uart:
  id: onkyo_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

onkyo_iscp:
  id: onkyo_receiver
  uart_id: onkyo_uart
  update_interval: 30s

binary_sensor:
  - platform: onkyo_iscp
    onkyo_iscp_id: onkyo_receiver
    connected:
      name: Receiver Connected

switch:
  - platform: onkyo_iscp
    onkyo_iscp_id: onkyo_receiver

    power:
      name: Power
      icon: mdi:power

    mute:
      name: Mute
      icon: mdi:volume-mute

    audyssey:
      name: Audyssey

    dynamic_eq:
      name: Dynamic EQ

    re_eq:
      name: Re-EQ

    music_optimizer:
      name: Music Optimizer

number:
  - platform: onkyo_iscp
    onkyo_iscp_id: onkyo_receiver

    master_volume:
      name: Master Volume Absolute
      mode: slider

    master_volume_relative:
      name: Master Volume Relative
      mode: slider
      
    front_bass:
      name: Front Bass
      mode: slider

    front_treble:
      name: Front Treble
      mode: slider

    subwoofer_level:
      name: Subwoofer Level
      mode: slider

    center_level:
      name: Center Level
      mode: slider

    sleep_timer:
      name: Sleep Timer
      mode: box

    fm_frequency:
      name: FM Frequency
      mode: box

    am_frequency:
      name: AM Frequency
      mode: box

    tuner_preset:
      name: Tuner Preset
      mode: box

select:
  - platform: onkyo_iscp
    onkyo_iscp_id: onkyo_receiver

    input:
      name: Input
          
    listening_mode:
      name: Listening Mode

    dynamic_volume:
      name: Dynamic Volume

    late_night:
      name: Late Night
    
    dimmer:
      name: Display Brightness

    audio_selector:
      name: Audio Selector

    speaker_layout:
      name: Speaker Layout
      disabled_by_default: true

    pty:
      name: RDS Program Type

    hdmi_audio_out:
      name: HDMI Audio Out
      disabled_by_default: true

    monitor_resolution:
      name: Monitor Resolution
      disabled_by_default: true

    video_wide_mode:
      name: Video Wide Mode
      disabled_by_default: true

    picture_mode:
      name: Picture Mode
      disabled_by_default: true
    
    display_mode:
      name: Display Mode
      
button:
  - platform: onkyo_iscp
    onkyo_iscp_id: onkyo_receiver

    volume_up:
      name: Volume Up

    volume_down:
      name: Volume Down

    query_all:
      name: Query Full Status

    preset_up:
      name: Next Preset

    preset_down:
      name: Previous Preset

    preset_store:
      name: Store Current Station
      
    rds_radio_text:
      name: Show RDS Radio Text

    rds_pty:
      name: Show RDS PTY

    rds_tp:
      name: Show RDS TP

    rds_next:
      name: Cycle RDS Display

    pty_scan:
      name: Start PTY Scan

    tp_scan:
      name: Start TP Scan

    osd_menu:
      name: Setup Menu
      disabled_by_default: true

    osd_up:
      name: OSD Up
      disabled_by_default: true

    osd_down:
      name: OSD Down
      disabled_by_default: true

    osd_left:
      name: OSD Left
      disabled_by_default: true

    osd_right:
      name: OSD Right
      disabled_by_default: true

    osd_enter:
      name: OSD Enter
      disabled_by_default: true

    osd_exit:
      name: OSD Exit
      disabled_by_default: true

    osd_home:
      name: OSD Home
      disabled_by_default: true

    osd_quick:
      name: Quick Setup
      disabled_by_default: true

    osd_audio:
      name: Audio Menu
      disabled_by_default: true

    osd_video:
      name: Video Menu
      disabled_by_default: true
      
    display_audio_format:
      name: Show Audio Format

    display_video_format:
      name: Show Video Format

    display_mode_next:
      name: Next Display Mode 

    speaker_level_test:
      name: Speaker Test Tone
      disabled_by_default: true

    speaker_level_next:
      name: Next Speaker
      disabled_by_default: true

    speaker_level_up:
      name: Increase Speaker Level
      disabled_by_default: true

    speaker_level_down:
      name: Decrease Speaker Level
      disabled_by_default: true
      
text_sensor:
  - platform: onkyo_iscp
    onkyo_iscp_id: onkyo_receiver
    audio_information:
      name: Audio Signal Information
    video_information:
      name: Video Signal Information
    last_frame:
      name: Last ISCP Frame
    last_unknown_frame:
      name: Last Unknown ISCP Frame
    display:
      name: Display
      disabled_by_default: true
    audio_source:
      name: Audio Source
    audio_input_format:
      name: Audio Input Format
    audio_sample_rate:
      name: Audio Sample Rate
    audio_input_channels:
      name: Audio Input Channels
    audio_output_format:
      name: Audio Output Format
    video_input:
      name: Video Input
    video_input_resolution:
      name: Video Input Resolution
    video_input_color_space:
      name: Video Input Color Space
    video_input_color_depth:
      name: Video Input Color Depth
    video_output:
      name: Video Output
    video_output_resolution:
      name: Video Output Resolution
    video_output_color_space:
      name: Video Output Color Space
    video_output_color_depth:
      name: Video Output Color Depth
