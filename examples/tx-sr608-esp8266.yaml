substitutions:
  device_name: onkyo-tx-sr608
  friendly_name: Onkyo TX-SR608

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp8266:
  board: nodemcuv2

# UART0 wird für den Onkyo verwendet.
# Deshalb keine serielle Logausgabe auf GPIO1/GPIO3.
logger:
  baud_rate: 0
  level: DEBUG

api:
  encryption:
    key: !secret onkyo_api_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot

  ap:
    ssid: "Onkyo Fallback"
    password: !secret fallback_password

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/domhit/esphome-onkyo-iscp
      ref: main
    components:
      - onkyo_iscp
    refresh: 0s

uart:
  id: onkyo_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

onkyo_iscp:
  id: onkyo_receiver
  uart_id: onkyo_uart
  update_interval: 30s

binary_sensor:
  - platform: onkyo_iscp
    onkyo_iscp_id: onkyo_receiver
    connected:
      name: Receiver verbunden

switch:
  - platform: onkyo_iscp
    onkyo_iscp_id: onkyo_receiver

    power:
      name: Power
      icon: mdi:power

    mute:
      name: Mute
      icon: mdi:volume-mute

    audyssey:
      name: Audyssey

    dynamic_eq:
      name: Dynamic EQ

    re_eq:
      name: Re-EQ

    music_optimizer:
      name: Music Optimizer

number:
  - platform: onkyo_iscp
    onkyo_iscp_id: onkyo_receiver

    master_volume:
      name: Lautstärke Rohwert
      mode: slider

    front_bass:
      name: Bass Front
      mode: slider

    front_treble:
      name: Treble Front
      mode: slider

    subwoofer_level:
      name: Subwoofer-Level
      mode: slider

    center_level:
      name: Center-Level
      mode: slider

    sleep_timer:
      name: Sleep-Timer
      mode: box

select:
  - platform: onkyo_iscp
    onkyo_iscp_id: onkyo_receiver

    input:
      name: Eingang

    listening_mode:
      name: Listening Mode

    dynamic_volume:
      name: Dynamic Volume

    late_night:
      name: Late Night
    
    dimmer:
      name: Displayhelligkeit

    audio_selector:
      name: Audio Selector

    speaker_layout:
      name: Speaker Layout
      disabled_by_default: true
      
button:
  - platform: onkyo_iscp
    onkyo_iscp_id: onkyo_receiver

    volume_up:
      name: Lauter

    volume_down:
      name: Leiser

    query_all:
      name: Status vollständig abfragen

text_sensor:
  - platform: onkyo_iscp
    onkyo_iscp_id: onkyo_receiver

    last_frame:
      name: Letzter ISCP-Frame
    
    last_unknown_frame:
      name: Letzter unbekannter ISCP-Frame
      
    display:
      name: Display
      disabled_by_default: true